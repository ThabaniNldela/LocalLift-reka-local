services:
  - type: web
    name: reka-local
    runtime: node
    plan: starter
    buildCommand: npm ci && npm --prefix Backend ci && npm run build
    startCommand: npm --prefix Backend start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: reka-local-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RECEIPT_FROM
        sync: false

databases:
  - name: reka-local-db
    plan: basic-256mb
    databaseName: reka_local
    user: reka_local
