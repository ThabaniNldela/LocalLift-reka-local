services:
  - type: web
    name: reka-local
    runtime: node
    plan: free
    buildCommand: npm ci && npm --prefix Backend ci && npm run build
    startCommand: npm --prefix Backend start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RECEIPT_FROM
        sync: false
